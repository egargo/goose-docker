name: Update Goose

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

env:
  GOOSE: https://api.github.com/repos/pressly/goose/releases/latest
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check latest Goose version
        id: version
        run: |
          echo "version=$(curl -sS $GOOSE | jq -r '.tag_name' | tr -d 'v')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: steps.exists.outputs.exists != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing Goose version
        id: exists
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@v6
        if: steps.exists.outputs.exists != 'true'
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=true
            type=raw,value=latest,enable=true
            type=sha,prefix=

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists != 'true'

      - name: Build and push Docker image to GitHub Container Registry
        uses: docker/build-push-action@v6
        if: steps.exists.outputs.exists != 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            version=${{ steps.version.outputs.version }}
